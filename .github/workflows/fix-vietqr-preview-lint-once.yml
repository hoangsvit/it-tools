name: Fix VietQR preview lint

on:
  push:
    branches:
      - fix/vietqr-preview-input
    paths:
      - .github/workflows/fix-vietqr-preview-lint-once.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/vietqr-preview-input

      - name: Apply lint-safe promise calls
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          source = path.read_text()
          old = 'void refreshShareImage();'
          count = source.count(old)
          if count != 3:
              raise SystemExit(f'Expected 3 no-void calls, found {count}')
          path.write_text(source.replace(old, 'refreshShareImage();'))
          PY

      - name: Commit lint fix and remove temporary workflow
        shell: bash
        run: |
          git config user.name "ePlus.DEV Bot"
          git config user.email "actions@users.noreply.github.com"
          git rm .github/workflows/fix-vietqr-preview-lint-once.yml
          git add src/tools/vietqr-bank-generator/vietqr-bank-generator.vue
          git commit -m "fix: satisfy VietQR preview lint rules"
          git push origin HEAD:fix/vietqr-preview-input
