name: Apply VietQR designer v3

on:
  push:
    branches:
      - fix/vietqr-desktop-layout
    paths:
      - .github/workflows/vietqr-design-customization-v3.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-desktop-layout
          fetch-depth: 0

      - name: Patch VietQR designer
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          def must_replace(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              return text.replace(old, new, 1)

          # 1) Transfer content: max 50 characters.
          service = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.ts')
          text = service.read_text(encoding='utf-8')
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = must_replace(
                  text,
                  "export const VIETQR_MAX_AMOUNT = '9999999999999';\n",
                  "export const VIETQR_MAX_AMOUNT = '9999999999999';\nexport const VIETQR_MAX_DESCRIPTION_LENGTH = 50;\n",
                  'service description constant',
              )
          text = text.replace('if (normalized.length > 25) {', 'if (normalized.length > VIETQR_MAX_DESCRIPTION_LENGTH) {')
          service.write_text(text, encoding='utf-8')

          test = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.test.ts')
          text = test.read_text(encoding='utf-8')
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = must_replace(
                  text,
                  '  VIETQR_MAX_AMOUNT,\n',
                  '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,\n',
                  'test import',
              )
          text = must_replace(
              text,
              "    expect(getVietQrDescriptionValidationError('12345678901234567890123456')).toBe('contentLength');",
              "    expect(VIETQR_MAX_DESCRIPTION_LENGTH).toBe(50);\n    expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH))).toBeNull();\n    expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH + 1))).toBe('contentLength');",
              'test description length',
          )
          test.write_text(text, encoding='utf-8')

          # 2) i18n: change only transfer-content 25 -> 50 and add designer labels.
          i18n = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.i18n.ts')
          source_lines = i18n.read_text(encoding='utf-8').splitlines()
          result = []
          locale = 'en'
          inserted_locales = set()
          en_design = [
              "    designTitle: 'QR design',",
              "    designHint: 'Customize QR colors, module shape, finder style, error correction, bank logo and output size.',",
              "    qrColor: 'QR color',",
              "    backgroundColor: 'Background color',",
              "    moduleStyle: 'QR module shape',",
              "    eyeStyle: 'Finder style',",
              "    square: 'Square',",
              "    rounded: 'Rounded',",
              "    dots: 'Dots',",
              "    circle: 'Circle',",
              "    errorCorrection: 'Error correction',",
              "    errorCorrectionHint: 'Use H when placing a logo in the center.',",
              "    qrSizeLabel: 'QR resolution',",
              "    centerLogo: 'Bank logo in QR center',",
              "    centerLogoHint: 'Places the selected bank logo on a protected background area.',",
              "    resetDesign: 'Reset design',",
          ]
          vi_design = [
              "    designTitle: 'Thiết kế QR',",
              "    designHint: 'Tùy chỉnh màu sắc, hình dạng điểm QR, mắt QR, mức sửa lỗi, logo ngân hàng và kích thước ảnh.',",
              "    qrColor: 'Màu QR',",
              "    backgroundColor: 'Màu nền',",
              "    moduleStyle: 'Kiểu hình dạng QR',",
              "    eyeStyle: 'Kiểu viền 3 góc',",
              "    square: 'Vuông',",
              "    rounded: 'Bo tròn',",
              "    dots: 'Tròn',",
              "    circle: 'Tròn',",
              "    errorCorrection: 'Mức độ sửa lỗi',",
              "    errorCorrectionHint: 'Nên dùng mức H khi đặt logo ở giữa QR.',",
              "    qrSizeLabel: 'Kích thước QR',",
              "    centerLogo: 'Logo ngân hàng giữa QR',",
              "    centerLogoHint: 'Chèn logo ngân hàng đã chọn vào giữa QR với vùng nền bảo vệ.',",
              "    resetDesign: 'Đặt lại thiết kế',",
          ]
          for line in source_lines:
              locale_match = re.match(r'^  ([a-zA-Z_-]+): \{$', line)
              if locale_match:
                  locale = locale_match.group(1)
              if 'contentPlaceholder:' in line or 'contentLength:' in line:
                  line = line.replace('25', '50')
              result.append(line)
              if 'contentPlaceholder:' in line and locale not in inserted_locales:
                  # Only add when this locale does not already contain designer keys later.
                  result.extend(vi_design if locale == 'vi' else en_design)
                  inserted_locales.add(locale)
          i18n.write_text('\n'.join(result) + '\n', encoding='utf-8')

          # 3) Vue: state, URL persistence, custom matrix renderer, controls.
          vue = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = vue.read_text(encoding='utf-8')

          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = must_replace(text, '  VIETQR_MAX_AMOUNT,\n', '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,\n', 'vue description import')

          if 'type QrModuleStyle' not in text:
              text = must_replace(
                  text,
                  "type CopyState = 'idle' | 'copied' | 'unsupported' | 'failed';",
                  "type CopyState = 'idle' | 'copied' | 'unsupported' | 'failed';\ntype QrModuleStyle = 'square' | 'rounded' | 'dots';\ntype QrEyeStyle = 'square' | 'rounded' | 'circle';\ntype QrErrorCorrection = 'L' | 'M' | 'Q' | 'H';",
                  'vue types',
              )

          if 'DEFAULT_QR_FOREGROUND' not in text:
              text = must_replace(
                  text,
                  "const CANVAS_MONO_FONT_FAMILY = 'ui-monospace, \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace';",
                  "const CANVAS_MONO_FONT_FAMILY = 'ui-monospace, \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace';\nconst DEFAULT_QR_FOREGROUND = '#111827';\nconst DEFAULT_QR_BACKGROUND = '#ffffff';\nconst DEFAULT_QR_MODULE_STYLE: QrModuleStyle = 'square';\nconst DEFAULT_QR_EYE_STYLE: QrEyeStyle = 'square';\nconst DEFAULT_QR_ERROR_CORRECTION: QrErrorCorrection = 'M';\nconst DEFAULT_QR_SIZE = 512;",
                  'vue design constants',
              )

          text = must_replace(
              text,
              '    descriptionValue.value = value;\n    scheduleDescriptionNormalization();',
              '    descriptionValue.value = value.slice(0, VIETQR_MAX_DESCRIPTION_LENGTH);\n    scheduleDescriptionNormalization();',
              'description typing limit',
          )

          if 'const qrForeground = ref(' not in text:
              text = must_replace(
                  text,
                  "const selectedTheme = ref<ThemeName>('purple');\n",
                  "const selectedTheme = ref<ThemeName>('purple');\nconst qrForeground = ref(DEFAULT_QR_FOREGROUND);\nconst qrBackground = ref(DEFAULT_QR_BACKGROUND);\nconst qrModuleStyle = ref<QrModuleStyle>(DEFAULT_QR_MODULE_STYLE);\nconst qrEyeStyle = ref<QrEyeStyle>(DEFAULT_QR_EYE_STYLE);\nconst qrErrorCorrection = ref<QrErrorCorrection>(DEFAULT_QR_ERROR_CORRECTION);\nconst qrSize = ref(DEFAULT_QR_SIZE);\nconst qrCenterLogo = ref(false);\n",
                  'designer refs',
              )
          if 'let qrRenderId = 0;' not in text:
              text = must_replace(text, 'let shareImageRenderId = 0;\n', 'let shareImageRenderId = 0;\nlet qrRenderId = 0;\n', 'QR render id')

          if 'descriptionCharacterCount' not in text:
              marker = "const amountValidationMessage = computed(() => isVietnameseLocale.value\n  ? `Số tiền phải là số nguyên VND dương, tối đa ${formattedMaximumAmount.value}.`\n  : t('validation.amount'));\n"
              text = must_replace(text, marker, marker + 'const descriptionCharacterCount = computed(() => descriptionValue.value.length);\n', 'description counter')

          # URL parameter declarations.
          text = must_replace(
              text,
              "  const themeParam = queryValue('theme').toLowerCase();\n",
              "  const themeParam = queryValue('theme').toLowerCase();\n  const qrColorParam = queryValue('qrColor');\n  const qrBgParam = queryValue('qrBg');\n  const qrStyleParam = queryValue('qrStyle');\n  const eyeStyleParam = queryValue('eyeStyle');\n  const eccParam = queryValue('ecc').toUpperCase();\n  const qrSizeParam = Number(queryValue('qrSize'));\n  const logoParam = queryValue('logo');\n",
              'designer URL declarations',
          )

          apply_end = """  if (themeParam) {
            selectedTheme.value = themeParam in THEME_PRESETS
              ? themeParam as ThemeName
              : 'purple';
          }
          }"""
          apply_new = """  if (themeParam) {
            selectedTheme.value = themeParam in THEME_PRESETS
              ? themeParam as ThemeName
              : 'purple';
          }

          if (/^#[0-9a-f]{6}$/i.test(qrColorParam)) {
            qrForeground.value = qrColorParam.toLowerCase();
          }
          if (/^#[0-9a-f]{6}$/i.test(qrBgParam)) {
            qrBackground.value = qrBgParam.toLowerCase();
          }
          if (['square', 'rounded', 'dots'].includes(qrStyleParam)) {
            qrModuleStyle.value = qrStyleParam as QrModuleStyle;
          }
          if (['square', 'rounded', 'circle'].includes(eyeStyleParam)) {
            qrEyeStyle.value = eyeStyleParam as QrEyeStyle;
          }
          if (['L', 'M', 'Q', 'H'].includes(eccParam)) {
            qrErrorCorrection.value = eccParam as QrErrorCorrection;
          }
          if (Number.isFinite(qrSizeParam) && qrSizeParam >= 256 && qrSizeParam <= 1024) {
            qrSize.value = Math.round(qrSizeParam / 64) * 64;
          }
          if (logoParam) {
            qrCenterLogo.value = logoParam === '1';
          }
          }"""
          text = must_replace(text, apply_end, apply_new, 'designer URL restore')

          text = must_replace(
              text,
              "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme']) {",
              "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme', 'qrColor', 'qrBg', 'qrStyle', 'eyeStyle', 'ecc', 'qrSize', 'logo']) {",
              'designer URL cleanup',
          )

          query_tail = """  if (selectedTheme.value !== 'purple') {
            query.theme = selectedTheme.value;
          }

          return query;"""
          query_new = """  if (selectedTheme.value !== 'purple') {
            query.theme = selectedTheme.value;
          }
          if (qrForeground.value !== DEFAULT_QR_FOREGROUND) {
            query.qrColor = qrForeground.value;
          }
          if (qrBackground.value !== DEFAULT_QR_BACKGROUND) {
            query.qrBg = qrBackground.value;
          }
          if (qrModuleStyle.value !== DEFAULT_QR_MODULE_STYLE) {
            query.qrStyle = qrModuleStyle.value;
          }
          if (qrEyeStyle.value !== DEFAULT_QR_EYE_STYLE) {
            query.eyeStyle = qrEyeStyle.value;
          }
          if (qrErrorCorrection.value !== DEFAULT_QR_ERROR_CORRECTION) {
            query.ecc = qrErrorCorrection.value;
          }
          if (qrSize.value !== DEFAULT_QR_SIZE) {
            query.qrSize = String(qrSize.value);
          }
          if (qrCenterLogo.value) {
            query.logo = '1';
          }

          return query;"""
          text = must_replace(text, query_tail, query_new, 'designer URL query')

          old_qr_watcher = """watch(qrPayload, async (payload) => {
            if (!payload) {
              qrDataUrl.value = '';
              return;
            }

            try {
              const rendered = await QRCode.toDataURL(payload, {
                width: 720,
                margin: 4,
                errorCorrectionLevel: 'M',
                color: {
                  dark: '#111827',
                  light: '#ffffff',
                },
              });

              if (qrPayload.value === payload) {
                qrDataUrl.value = rendered;
              }
            }
            catch {
              if (qrPayload.value === payload) {
                qrDataUrl.value = '';
              }
            }
          }, { immediate: true });"""

          new_qr_watcher = """function isFinderModule(row: number, column: number, moduleCount: number) {
            return (row < 7 && column < 7)
              || (row < 7 && column >= moduleCount - 7)
              || (row >= moduleCount - 7 && column < 7);
          }

          function drawQrModule(
            context: CanvasRenderingContext2D,
            x: number,
            y: number,
            moduleSize: number,
            style: QrModuleStyle,
          ) {
            context.fillStyle = qrForeground.value;
            if (style === 'square') {
              context.fillRect(x, y, moduleSize + 0.05, moduleSize + 0.05);
              return;
            }

            const inset = style === 'dots' ? moduleSize * 0.12 : moduleSize * 0.06;
            const size = moduleSize - inset * 2;
            if (style === 'dots') {
              context.beginPath();
              context.arc(x + moduleSize / 2, y + moduleSize / 2, size / 2, 0, Math.PI * 2);
              context.fill();
              return;
            }

            fillRoundedRect(context, x + inset, y + inset, size, size, moduleSize * 0.28, qrForeground.value);
          }

          function drawQrEye(
            context: CanvasRenderingContext2D,
            startRow: number,
            startColumn: number,
            moduleSize: number,
            margin: number,
          ) {
            const x = (margin + startColumn) * moduleSize;
            const y = (margin + startRow) * moduleSize;
            const outer = moduleSize * 7;
            const middle = moduleSize * 5;
            const center = moduleSize * 3;
            let outerRadius = 0;
            if (qrEyeStyle.value === 'rounded') {
              outerRadius = moduleSize * 1.6;
            }
            else if (qrEyeStyle.value === 'circle') {
              outerRadius = outer / 2;
            }

            if (outerRadius === 0) {
              context.fillStyle = qrForeground.value;
              context.fillRect(x, y, outer, outer);
              context.fillStyle = qrBackground.value;
              context.fillRect(x + moduleSize, y + moduleSize, middle, middle);
              context.fillStyle = qrForeground.value;
              context.fillRect(x + moduleSize * 2, y + moduleSize * 2, center, center);
              return;
            }

            fillRoundedRect(context, x, y, outer, outer, outerRadius, qrForeground.value);
            fillRoundedRect(
              context,
              x + moduleSize,
              y + moduleSize,
              middle,
              middle,
              Math.max(moduleSize, outerRadius - moduleSize),
              qrBackground.value,
            );
            fillRoundedRect(
              context,
              x + moduleSize * 2,
              y + moduleSize * 2,
              center,
              center,
              qrEyeStyle.value === 'circle' ? center / 2 : moduleSize * 0.8,
              qrForeground.value,
            );
          }

          async function renderStyledQr(payload: string) {
            const generated = QRCode.create(payload, { errorCorrectionLevel: qrErrorCorrection.value });
            const moduleCount = generated.modules.size;
            const margin = 4;
            const canvas = document.createElement('canvas');
            canvas.width = qrSize.value;
            canvas.height = qrSize.value;
            const context = canvas.getContext('2d');
            if (!context) {
              return '';
            }

            context.imageSmoothingEnabled = false;
            context.fillStyle = qrBackground.value;
            context.fillRect(0, 0, canvas.width, canvas.height);
            const moduleSize = canvas.width / (moduleCount + margin * 2);

            for (let row = 0; row < moduleCount; row += 1) {
              for (let column = 0; column < moduleCount; column += 1) {
                if (isFinderModule(row, column, moduleCount)) {
                  continue;
                }
                if (!generated.modules.data[row * moduleCount + column]) {
                  continue;
                }
                drawQrModule(
                  context,
                  (margin + column) * moduleSize,
                  (margin + row) * moduleSize,
                  moduleSize,
                  qrModuleStyle.value,
                );
              }
            }

            drawQrEye(context, 0, 0, moduleSize, margin);
            drawQrEye(context, 0, moduleCount - 7, moduleSize, margin);
            drawQrEye(context, moduleCount - 7, 0, moduleSize, margin);

            if (qrCenterLogo.value && selectedBank.value?.logo) {
              const logo = await loadImage(selectedBank.value.logo).catch(() => null);
              if (logo) {
                const logoBoxSize = canvas.width * 0.18;
                const logoSize = logoBoxSize * 0.74;
                fillRoundedRect(
                  context,
                  (canvas.width - logoBoxSize) / 2,
                  (canvas.height - logoBoxSize) / 2,
                  logoBoxSize,
                  logoBoxSize,
                  logoBoxSize * 0.22,
                  qrBackground.value,
                );
                drawContainImage(
                  context,
                  logo,
                  (canvas.width - logoSize) / 2,
                  (canvas.height - logoSize) / 2,
                  logoSize,
                  logoSize,
                );
              }
            }

            return canvas.toDataURL('image/png');
          }

          watch(
            [qrPayload, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],
            async ([payload]) => {
              const renderId = ++qrRenderId;
              if (!payload) {
                qrDataUrl.value = '';
                return;
              }

              try {
                const rendered = await renderStyledQr(payload);
                if (renderId === qrRenderId) {
                  qrDataUrl.value = rendered;
                }
              }
              catch {
                if (renderId === qrRenderId) {
                  qrDataUrl.value = '';
                }
              }
            },
            { immediate: true },
          );"""
          text = must_replace(text, old_qr_watcher, new_qr_watcher, 'custom QR renderer')

          text = must_replace(
              text,
              """watch(
            [selectedBankBin, accountNo, amount, description, selectedTheme],
            scheduleUrlSync,
          );""",
              """watch(
            [
              selectedBankBin,
              accountNo,
              amount,
              description,
              selectedTheme,
              qrForeground,
              qrBackground,
              qrModuleStyle,
              qrEyeStyle,
              qrErrorCorrection,
              qrSize,
              qrCenterLogo,
            ],
            scheduleUrlSync,
          );""",
              'designer URL watcher',
          )

          reset_block = """function resetForm() {
            selectedBankBin.value = '';
            accountNo.value = '';
            amount.value = '';
            setDescriptionFromExternal('');

            window.localStorage.removeItem(`${STORAGE_PREFIX}:bank`);
            clearSensitiveStorage();
          }
          """
          if 'function resetDesign()' not in text:
              text = must_replace(
                  text,
                  reset_block,
                  reset_block + """
          function resetDesign() {
            qrForeground.value = DEFAULT_QR_FOREGROUND;
            qrBackground.value = DEFAULT_QR_BACKGROUND;
            qrModuleStyle.value = DEFAULT_QR_MODULE_STYLE;
            qrEyeStyle.value = DEFAULT_QR_EYE_STYLE;
            qrErrorCorrection.value = DEFAULT_QR_ERROR_CORRECTION;
            qrSize.value = DEFAULT_QR_SIZE;
            qrCenterLogo.value = false;
          }
          """,
                  'reset design',
              )

          content_field = """              <c-input-text
                v-model:value=\"descriptionInput\"
                :label=\"t('contentLabel')\"
                :placeholder=\"t('contentPlaceholder')\"
                :validation-rules=\"descriptionValidationRules\"
                raw-text
              />"""
          content_new = """              <div class=\"content-field\">
                <c-input-text
                  v-model:value=\"descriptionInput\"
                  :label=\"t('contentLabel')\"
                  :placeholder=\"t('contentPlaceholder')\"
                  :validation-rules=\"descriptionValidationRules\"
                  raw-text
                />
                <div class=\"content-counter\">
                  {{ descriptionCharacterCount }}/{{ VIETQR_MAX_DESCRIPTION_LENGTH }}
                </div>
              </div>"""
          text = must_replace(text, content_field, content_new, 'content character counter')

          technical_card = '        <c-card v-if="selectedBankInfo.length" :title="t(\'technicalTitle\')">'
          if 'class="design-stack"' not in text:
              design_card = """        <c-card :title=\"t('designTitle')\">
            <div class=\"design-stack\">
              <div class=\"design-hint\">
                {{ t('designHint') }}
              </div>

              <div class=\"design-color-grid\">
                <label class=\"design-control\">
                  <span>{{ t('qrColor') }}</span>
                  <div class=\"color-control\">
                    <input v-model=\"qrForeground\" type=\"color\" aria-label=\"QR color\">
                    <code>{{ qrForeground.toUpperCase() }}</code>
                  </div>
                </label>
                <label class=\"design-control\">
                  <span>{{ t('backgroundColor') }}</span>
                  <div class=\"color-control\">
                    <input v-model=\"qrBackground\" type=\"color\" aria-label=\"QR background color\">
                    <code>{{ qrBackground.toUpperCase() }}</code>
                  </div>
                </label>
              </div>

              <div class=\"design-section\">
                <div class=\"design-label\">{{ t('moduleStyle') }}</div>
                <div class=\"design-options\">
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'square' }\" @click=\"qrModuleStyle = 'square'\">{{ t('square') }}</button>
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'rounded' }\" @click=\"qrModuleStyle = 'rounded'\">{{ t('rounded') }}</button>
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'dots' }\" @click=\"qrModuleStyle = 'dots'\">{{ t('dots') }}</button>
                </div>
              </div>

              <div class=\"design-section\">
                <div class=\"design-label\">{{ t('eyeStyle') }}</div>
                <div class=\"design-options\">
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'square' }\" @click=\"qrEyeStyle = 'square'\">{{ t('square') }}</button>
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'rounded' }\" @click=\"qrEyeStyle = 'rounded'\">{{ t('rounded') }}</button>
                  <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'circle' }\" @click=\"qrEyeStyle = 'circle'\">{{ t('circle') }}</button>
                </div>
              </div>

              <div class=\"design-settings-grid\">
                <label class=\"design-control\">
                  <span>{{ t('errorCorrection') }}</span>
                  <select v-model=\"qrErrorCorrection\" class=\"design-select\">
                    <option value=\"L\">L (~7%)</option>
                    <option value=\"M\">M (~15%)</option>
                    <option value=\"Q\">Q (~25%)</option>
                    <option value=\"H\">H (~30%)</option>
                  </select>
                  <small>{{ t('errorCorrectionHint') }}</small>
                </label>
                <label class=\"design-control\">
                  <span>{{ t('qrSizeLabel') }}: {{ qrSize }}px</span>
                  <input v-model.number=\"qrSize\" class=\"design-range\" type=\"range\" min=\"256\" max=\"1024\" step=\"64\">
                </label>
              </div>

              <label class=\"logo-toggle\">
                <input v-model=\"qrCenterLogo\" type=\"checkbox\">
                <span>
                  <strong>{{ t('centerLogo') }}</strong>
                  <small>{{ t('centerLogoHint') }}</small>
                </span>
              </label>

              <div class=\"form-actions\">
                <c-button @click=\"resetDesign\">{{ t('resetDesign') }}</c-button>
              </div>
            </div>
          </c-card>

          """
              text = must_replace(text, technical_card, design_card + technical_card, 'design card')

          css_anchor = ".preview-column {\n  min-width: 0;\n}\n"
          if '.design-stack {' not in text:
              design_css = """.content-field {
            min-width: 0;
          }

          .content-counter {
            margin-top: 5px;
            opacity: 0.55;
            font-size: 11px;
            text-align: right;
          }

          .design-stack {
            display: flex;
            flex-direction: column;
            gap: 18px;
          }

          .design-hint {
            opacity: 0.65;
            font-size: 13px;
          }

          .design-color-grid,
          .design-settings-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 16px;
          }

          .design-control {
            display: flex;
            min-width: 0;
            flex-direction: column;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
          }

          .design-control small,
          .logo-toggle small {
            opacity: 0.58;
            font-size: 11px;
            font-weight: 400;
            line-height: 1.4;
          }

          .color-control {
            display: flex;
            min-height: 42px;
            align-items: center;
            gap: 10px;
            box-sizing: border-box;
            padding: 6px 10px;
            border: 1px solid rgba(148, 163, 184, 0.28);
