          mobile = '@media (max-width: 480px) {\n'
          if '.design-settings-grid {\n    grid-template-columns: minmax(0, 1fr);' not in text:
              text = must_replace(
                  text,
                  mobile,
                  mobile + "  .design-color-grid,\n  .design-settings-grid {\n    grid-template-columns: minmax(0, 1fr);\n  }\n\n",
