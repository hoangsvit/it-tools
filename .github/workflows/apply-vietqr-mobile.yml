name: Apply VietQR mobile patch

on:
  push:
    branches:
      - fix/vietqr-mobile-layout

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-mobile-layout
          fetch-depth: 0
      - run: python .github/scripts/patch-vietqr-mobile.py
      - run: rm .github/workflows/apply-vietqr-mobile.yml .github/scripts/patch-vietqr-mobile.py
      - run: |
          git config user.name "David Nguyen"
          git config user.email "h250694@gmail.com"
          git add src/tools/vietqr-bank-generator/vietqr-bank-generator.vue .github/workflows/apply-vietqr-mobile.yml .github/scripts/patch-vietqr-mobile.py
          git commit -m "fix: optimize VietQR layout for mobile"
          git push origin HEAD:fix/vietqr-mobile-layout
