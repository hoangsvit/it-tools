name: Fix VietQR race conditions once

on:
  push:
    branches:
      - fix/vietqr-preview-input
    paths:
      - .github/workflows/fix-vietqr-races-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: fix/vietqr-preview-input
      - name: Patch VietQR preview races
        shell: python
        run: |
          from pathlib import Path

          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = path.read_text()

          old = """const qrDataUrl = ref('');
          const copyState = ref<CopyState>('idle');"""
          new = """const qrDataUrl = ref('');
          const qrRendering = ref(false);
          const copyState = ref<CopyState>('idle');"""
          assert old in text, 'qrDataUrl insertion point not found'
          text = text.replace(old, new, 1)

          old = """watch(
            [qrPayload, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],
            async ([payload]) => {
              const renderId = ++qrRenderId;
              if (!payload) {
                qrDataUrl.value = '';
                return;
              }

              try {
                const rendered = await renderStyledQr(payload);
                if (renderId === qrRenderId) {
                  qrDataUrl.value = rendered;
                }
              }
              catch {
                if (renderId === qrRenderId) {
                  qrDataUrl.value = '';
                }
              }
            },
            { immediate: true },
          );"""
          new = """watch(
            [qrPayload, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],
            async ([payload]) => {
              const renderId = ++qrRenderId;

              // Any QR payload/design change makes the current exported image stale
              // immediately. Invalidate in-flight exports before awaiting QR work so
              // stale PNGs can never become visible/copyable during a slow render.
              shareImageRenderId += 1;
              shareImageRendering.value = true;
              qrRendering.value = true;

              if (!payload) {
                qrDataUrl.value = '';
                qrRendering.value = false;
                await refreshShareImage();
                return;
              }

              try {
                const rendered = await renderStyledQr(payload);
                if (renderId === qrRenderId) {
                  qrDataUrl.value = rendered;
                }
              }
              catch {
                if (renderId === qrRenderId) {
                  qrDataUrl.value = '';
                }
              }
              finally {
                if (renderId === qrRenderId) {
                  qrRendering.value = false;
                }
              }
            },
            { immediate: true },
          );"""
          assert old in text, 'QR watcher block not found'
          text = text.replace(old, new, 1)

          old = """function scheduleShareImageRefresh() {
            if (shareImageRefreshTimer !== undefined && typeof window !== 'undefined') {
              window.clearTimeout(shareImageRefreshTimer);
              shareImageRefreshTimer = undefined;
            }

            // Keep the lightweight live preview responsive while the user is typing.
            // The export-sized 900x1200 canvas is regenerated only after input settles,
            // preventing stale QR snapshots and unnecessary canvas work on every key.
            if (!qrDataUrl.value || !selectedBank.value) {
              refreshShareImage();
              return;
            }

            shareImageRendering.value = true;

            if (typeof window === 'undefined') {
              refreshShareImage();
              return;
            }

            shareImageRefreshTimer = window.setTimeout(() => {
              shareImageRefreshTimer = undefined;
              refreshShareImage();
            }, SHARE_IMAGE_REFRESH_DELAY_MS);
          }"""
          new = """function scheduleShareImageRefresh() {
            if (shareImageRefreshTimer !== undefined && typeof window !== 'undefined') {
              window.clearTimeout(shareImageRefreshTimer);
              shareImageRefreshTimer = undefined;
            }

            // Invalidate any export already in flight before entering the debounce
            // window. Its generation checks will then prevent it from committing a
            // stale blob/object URL or clearing the pending rendering state.
            shareImageRenderId += 1;
            shareImageRendering.value = true;

            // A payload/design change may still be producing the corresponding QR.
            // Wait for that render to finish instead of exporting the previous QR.
            // qrRendering is watched below, so completion schedules the fresh export.
            if (qrRendering.value) {
              return;
            }

            // Keep the lightweight live preview responsive while the user is typing.
            // The export-sized 900x1200 canvas is regenerated only after input settles,
            // preventing stale QR snapshots and unnecessary canvas work on every key.
            if (!qrDataUrl.value || !selectedBank.value) {
              refreshShareImage();
              return;
            }

            if (typeof window === 'undefined') {
              refreshShareImage();
              return;
            }

            shareImageRefreshTimer = window.setTimeout(() => {
              shareImageRefreshTimer = undefined;
              refreshShareImage();
            }, SHARE_IMAGE_REFRESH_DELAY_MS);
          }"""
          assert old in text, 'share refresh scheduler block not found'
          text = text.replace(old, new, 1)

          old = """watch(
            [qrDataUrl, selectedTheme, selectedBankBin, accountNo, payerName, amount, description, locale],
            scheduleShareImageRefresh,
            { immediate: true },
          );"""
          new = """watch(
            [qrDataUrl, qrRendering, selectedTheme, selectedBankBin, accountNo, payerName, amount, description, locale],
            scheduleShareImageRefresh,
            { immediate: true },
          );"""
          assert old in text, 'share watcher block not found'
          text = text.replace(old, new, 1)

          old = """  clearDescriptionNormalizeTimer();
            shareImageRenderId += 1;
            revokeShareImageUrl();"""
          new = """  clearDescriptionNormalizeTimer();
            qrRenderId += 1;
            shareImageRenderId += 1;
            revokeShareImageUrl();"""
          assert old in text, 'unmount invalidation block not found'
          text = text.replace(old, new, 1)

          path.write_text(text)

      - name: Remove one-shot workflow and commit
        run: |
          rm .github/workflows/fix-vietqr-races-once.yml
          git config user.name "David Nguyen"
          git config user.email "h250694@gmail.com"
          git add src/tools/vietqr-bank-generator/vietqr-bank-generator.vue .github/workflows/fix-vietqr-races-once.yml
          git commit -m "fix: invalidate stale VietQR preview renders"
          git push origin HEAD:fix/vietqr-preview-input
