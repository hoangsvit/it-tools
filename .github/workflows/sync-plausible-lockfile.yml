name: Sync lockfile after Plausible removal

on:
  push:
    branches:
      - feat/eplus-developer-experience

permissions:
  contents: write

jobs:
  sync-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          ref: feat/eplus-developer-experience
          fetch-depth: 0
      - run: corepack enable
      - uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: pnpm
      - name: Regenerate pnpm lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile
      - name: Commit lockfile if changed
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "Lockfile is already in sync."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: sync lockfile after removing Plausible"
          git push origin HEAD:feat/eplus-developer-experience
