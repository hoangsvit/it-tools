name: ci

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - run: corepack enable
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm i

      - name: Run linters
        run: pnpm lint

      - name: Test ePlus related-tool recommendations
        run: pnpm exec vitest run --environment jsdom src/tools/tool-recommendations.test.ts

      - name: Test ePlus developer workflows
        run: pnpm exec vitest run --environment jsdom src/tools/developer-workflows.test.ts

      - name: Test ePlus developer workspace
        run: pnpm exec vitest run --environment jsdom src/modules/developer-workspace/workspace.model.test.ts

      - name: Run unit test
        run: pnpm test

      - name: Type check
        run: pnpm typecheck

      - name: Build the app
        run: pnpm build
