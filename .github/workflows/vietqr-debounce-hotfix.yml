name: Apply VietQR transfer content debounce fix

on:
  push:
    branches:
      - fix/vietqr-desktop-layout
    paths:
      - .github/workflows/vietqr-debounce-hotfix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-desktop-layout
          fetch-depth: 0

      - name: Patch VietQR transfer content input
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path
          import re

          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(pattern: str, replacement: str, label: str, flags: int = 0):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 replacement, got {count}')

          replace_once(
              r"const descriptionValue = ref\(''\);\nconst description = computed\(\{\n  get: \(\) => descriptionValue\.value,\n  set: \(value: string\) => \{\n    descriptionValue\.value = sanitizeVietQrDescriptionInput\(value\);\n  \},\n\}\);",
              """const descriptionValue = ref('');
          const description = ref('');
          const descriptionInput = computed({
            get: () => descriptionValue.value,
            set: (value: string) => {
              descriptionValue.value = value;
              scheduleDescriptionNormalization();
            },
          });""",
              'description model',
          )

          replace_once(
              r"let urlSyncReady = false;\nlet urlSyncTimer: number \| undefined;",
              """let urlSyncReady = false;
          let urlSyncTimer: number | undefined;
          let descriptionNormalizeTimer: number | undefined;
          const DESCRIPTION_NORMALIZE_DELAY_MS = 600;""",
              'debounce state',
          )

          replace_once(
              r"const descriptionValidationRules = computed\(\(\) => \[\n  \{\n    message: t\('validation\.contentCharset'\),\n    validator: \(value: string\) => getVietQrDescriptionValidationError\(value\) !== 'contentCharset',\n  \},\n  \{\n    message: t\('validation\.contentLength'\),\n    validator: \(value: string\) => getVietQrDescriptionValidationError\(value\) !== 'contentLength',\n  \},\n\]\);",
              """const descriptionValidationRules = computed(() => [
            {
              message: t('validation.contentCharset'),
              validator: (value: string) => getVietQrDescriptionValidationError(sanitizeVietQrDescriptionInput(value)) !== 'contentCharset',
            },
            {
              message: t('validation.contentLength'),
              validator: (value: string) => getVietQrDescriptionValidationError(sanitizeVietQrDescriptionInput(value)) !== 'contentLength',
            },
          ]);""",
              'description validation',
          )

          replace_once(
              r"  if \(contentParam\) \{\n    description\.value = contentParam\.trim\(\);\n  \}",
              """  if (contentParam) {
            setDescriptionFromExternal(contentParam.trim());
          }""",
              'URL restore',
          )

          marker = "\nwatch(qrPayload, async (payload) => {"
          if marker not in text:
              raise SystemExit('QR watcher marker not found')
          debounce_helpers = """

          function clearDescriptionNormalizeTimer() {
            if (descriptionNormalizeTimer !== undefined && typeof window !== 'undefined') {
              window.clearTimeout(descriptionNormalizeTimer);
              descriptionNormalizeTimer = undefined;
            }
          }

          function commitDescriptionInput() {
            clearDescriptionNormalizeTimer();
            const sanitized = sanitizeVietQrDescriptionInput(descriptionValue.value);
            descriptionValue.value = sanitized;
            description.value = sanitized;
          }

          function scheduleDescriptionNormalization() {
            if (typeof window === 'undefined') {
              const sanitized = sanitizeVietQrDescriptionInput(descriptionValue.value);
              descriptionValue.value = sanitized;
              description.value = sanitized;
              return;
            }

            clearDescriptionNormalizeTimer();
            descriptionNormalizeTimer = window.setTimeout(() => {
              commitDescriptionInput();
            }, DESCRIPTION_NORMALIZE_DELAY_MS);
          }

          function setDescriptionFromExternal(value: string) {
            clearDescriptionNormalizeTimer();
            const sanitized = sanitizeVietQrDescriptionInput(value);
            descriptionValue.value = sanitized;
            description.value = sanitized;
          }
          """
          text = text.replace(marker, debounce_helpers + marker, 1)

          replace_once(
              r"  description\.value = '';\n\n  window\.localStorage\.removeItem\(`\$\{STORAGE_PREFIX\}:bank`\);",
              """  setDescriptionFromExternal('');

            window.localStorage.removeItem(`${STORAGE_PREFIX}:bank`);""",
              'reset form',
          )

          replace_once(
              r"v-model:value=\"description\"\n\s+:label=\"t\('contentLabel'\)\"",
              """v-model:value="descriptionInput"
                :label="t('contentLabel')"""",
              'template model',
          )

          replace_once(
              r"onBeforeUnmount\(\(\) => \{\n  if \(urlSyncTimer !== undefined\) \{\n    window\.clearTimeout\(urlSyncTimer\);\n  \}\n  shareImageRenderId \+= 1;",
              """onBeforeUnmount(() => {
            if (urlSyncTimer !== undefined) {
              window.clearTimeout(urlSyncTimer);
            }
            clearDescriptionNormalizeTimer();
            shareImageRenderId += 1;""",
              'unmount cleanup',
          )

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/vietqr-debounce-hotfix.yml

      - name: Commit fix
        shell: bash
        run: |
          git config user.name "eplus-bot"
          git config user.email "157664013+eplus-bot@users.noreply.github.com"
          git add src/tools/vietqr-bank-generator/vietqr-bank-generator.vue .github/workflows/vietqr-debounce-hotfix.yml
          git commit -m "fix: debounce VietQR transfer content normalization"
          git push origin HEAD:fix/vietqr-desktop-layout
