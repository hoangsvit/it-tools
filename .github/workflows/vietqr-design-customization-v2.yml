name: Apply VietQR design customization v2

on:
  push:
    branches:
      - fix/vietqr-desktop-layout
    paths:
      - .github/workflows/vietqr-design-customization-v2.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-desktop-layout
          fetch-depth: 0

      - name: Patch VietQR generator
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          # service
          service = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.ts')
          text = service.read_text(encoding='utf-8')
          anchor = "export const VIETQR_MAX_AMOUNT = '9999999999999';\n"
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              if anchor not in text:
                  raise SystemExit('service constant anchor not found')
              text = text.replace(anchor, anchor + "export const VIETQR_MAX_DESCRIPTION_LENGTH = 50;\n", 1)
          if 'if (normalized.length > 25) {' in text:
              text = text.replace('if (normalized.length > 25) {', 'if (normalized.length > VIETQR_MAX_DESCRIPTION_LENGTH) {', 1)
          service.write_text(text, encoding='utf-8')

          # tests
          test = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.test.ts')
          text = test.read_text(encoding='utf-8')
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = text.replace('  VIETQR_MAX_AMOUNT,\n', '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,\n', 1)
          old_assert = "    expect(getVietQrDescriptionValidationError('12345678901234567890123456')).toBe('contentLength');"
          new_assert = """    expect(VIETQR_MAX_DESCRIPTION_LENGTH).toBe(50);
              expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH))).toBeNull();
              expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH + 1))).toBe('contentLength');"""
          if old_assert not in text:
              raise SystemExit('transfer length assertion not found')
          text = text.replace(old_assert, new_assert, 1)
          test.write_text(text, encoding='utf-8')

          # i18n: update transfer-content limit only
          i18n = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.i18n.ts')
          lines = i18n.read_text(encoding='utf-8').splitlines()
          updated = []
          for line in lines:
              if 'contentPlaceholder:' in line or 'contentLength:' in line:
                  line = line.replace('25', '50')
              updated.append(line)
          text = '\n'.join(updated) + '\n'

          en_anchor = "    contentPlaceholder: 'Optional, max 50 unaccented characters',\n"
          en_extra = """    designTitle: 'QR design',
            designHint: 'Customize QR colors, module style, finder style, error correction, logo and output size.',
            qrColor: 'QR color',
            backgroundColor: 'Background',
            moduleStyle: 'QR module style',
            eyeStyle: 'Finder style',
            square: 'Square',
            rounded: 'Rounded',
            dots: 'Dots',
            circle: 'Circle',
            errorCorrection: 'Error correction',
            errorCorrectionHint: 'Use H when placing the bank logo in the center.',
            qrSizeLabel: 'QR resolution',
            centerLogo: 'Bank logo in QR center',
            centerLogoHint: 'Adds the selected bank logo with a protected background area.',
            resetDesign: 'Reset design',
          """
          if 'designTitle:' not in text:
              if en_anchor not in text:
                  raise SystemExit('English i18n anchor not found')
              text = text.replace(en_anchor, en_anchor + en_extra, 1)

          vi_anchor = "    contentPlaceholder: 'Không bắt buộc, tối đa 50 ký tự không dấu',\n"
          vi_extra = """    designTitle: 'Thiết kế QR',
            designHint: 'Tùy chỉnh màu sắc, kiểu điểm QR, mắt QR, mức sửa lỗi, logo và kích thước xuất ảnh.',
            qrColor: 'Màu QR',
            backgroundColor: 'Màu nền',
            moduleStyle: 'Kiểu hình dạng QR',
            eyeStyle: 'Kiểu viền 3 góc',
            square: 'Vuông',
            rounded: 'Bo tròn',
            dots: 'Tròn',
            circle: 'Tròn',
            errorCorrection: 'Mức độ sửa lỗi',
            errorCorrectionHint: 'Nên dùng mức H khi đặt logo ngân hàng ở giữa QR.',
            qrSizeLabel: 'Kích thước QR',
            centerLogo: 'Logo ngân hàng giữa QR',
            centerLogoHint: 'Chèn logo ngân hàng đã chọn vào giữa QR với vùng nền bảo vệ.',
            resetDesign: 'Đặt lại thiết kế',
          """
          if vi_anchor not in text:
              raise SystemExit('Vietnamese i18n anchor not found')
          vi_start = text.index('  vi: {')
          vi_end = text.index('  de: {', vi_start)
          if 'designTitle:' not in text[vi_start:vi_end]:
              text = text.replace(vi_anchor, vi_anchor + vi_extra, 1)
          i18n.write_text(text, encoding='utf-8')

          # Vue component
          vue = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = vue.read_text(encoding='utf-8')

          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = text.replace('  VIETQR_MAX_AMOUNT,\n', '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,\n', 1)

          type_anchor = "type CopyState = 'idle' | 'copied' | 'unsupported' | 'failed';"
          if 'type QrModuleStyle' not in text:
              text = text.replace(type_anchor, type_anchor + "\ntype QrModuleStyle = 'square' | 'rounded' | 'dots';\ntype QrEyeStyle = 'square' | 'rounded' | 'circle';\ntype QrErrorCorrection = 'L' | 'M' | 'Q' | 'H';", 1)

          font_anchor = "const CANVAS_MONO_FONT_FAMILY = 'ui-monospace, \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace';"
          if 'DEFAULT_QR_FOREGROUND' not in text:
              text = text.replace(font_anchor, font_anchor + "\nconst DEFAULT_QR_FOREGROUND = '#111827';\nconst DEFAULT_QR_BACKGROUND = '#ffffff';\nconst DEFAULT_QR_MODULE_STYLE: QrModuleStyle = 'square';\nconst DEFAULT_QR_EYE_STYLE: QrEyeStyle = 'square';\nconst DEFAULT_QR_ERROR_CORRECTION: QrErrorCorrection = 'M';\nconst DEFAULT_QR_SIZE = 512;", 1)

          old = """const descriptionInput = computed({
            get: () => descriptionValue.value,
            set: (value: string) => {
              descriptionValue.value = value;
              scheduleDescriptionNormalization();
            },
          });"""
          new = """const descriptionInput = computed({
            get: () => descriptionValue.value,
            set: (value: string) => {
              descriptionValue.value = value.slice(0, VIETQR_MAX_DESCRIPTION_LENGTH);
              scheduleDescriptionNormalization();
            },
          });"""
          if old not in text:
              raise SystemExit('description input block not found')
          text = text.replace(old, new, 1)

          state_anchor = "const selectedTheme = ref<ThemeName>('purple');\n"
          if 'const qrForeground = ref(' not in text:
              state = """const qrForeground = ref(DEFAULT_QR_FOREGROUND);
          const qrBackground = ref(DEFAULT_QR_BACKGROUND);
          const qrModuleStyle = ref<QrModuleStyle>(DEFAULT_QR_MODULE_STYLE);
          const qrEyeStyle = ref<QrEyeStyle>(DEFAULT_QR_EYE_STYLE);
          const qrErrorCorrection = ref<QrErrorCorrection>(DEFAULT_QR_ERROR_CORRECTION);
          const qrSize = ref(DEFAULT_QR_SIZE);
          const qrCenterLogo = ref(false);
          """
              text = text.replace(state_anchor, state_anchor + state, 1)

          if 'let qrRenderId = 0;' not in text:
              text = text.replace('let shareImageRenderId = 0;\n', 'let shareImageRenderId = 0;\nlet qrRenderId = 0;\n', 1)

          msg_anchor = "const amountValidationMessage = computed(() => isVietnameseLocale.value\n  ? `Số tiền phải là số nguyên VND dương, tối đa ${formattedMaximumAmount.value}.`\n  : t('validation.amount'));\n"
          if 'descriptionCharacterCount' not in text:
              if msg_anchor not in text:
                  raise SystemExit('amount message anchor not found')
              text = text.replace(msg_anchor, msg_anchor + 'const descriptionCharacterCount = computed(() => descriptionValue.value.length);\n', 1)

          old = """  const contentParam = queryValue('content', 'description');
            const themeParam = queryValue('theme').toLowerCase();"""
          new = """  const contentParam = queryValue('content', 'description');
            const themeParam = queryValue('theme').toLowerCase();
            const qrColorParam = queryValue('qrColor');
            const qrBgParam = queryValue('qrBg');
            const qrStyleParam = queryValue('qrStyle');
            const eyeStyleParam = queryValue('eyeStyle');
            const eccParam = queryValue('ecc').toUpperCase();
            const qrSizeParam = Number(queryValue('qrSize'));
            const logoParam = queryValue('logo');"""
          if old not in text:
              raise SystemExit('URL declarations anchor not found')
          text = text.replace(old, new, 1)

          theme_restore = """  if (themeParam) {
            selectedTheme.value = themeParam in THEME_PRESETS
              ? themeParam as ThemeName
              : 'purple';
          }
          """
          design_restore = """
            if (/^#[0-9a-f]{6}$/i.test(qrColorParam)) qrForeground.value = qrColorParam.toLowerCase();
            if (/^#[0-9a-f]{6}$/i.test(qrBgParam)) qrBackground.value = qrBgParam.toLowerCase();
            if (['square', 'rounded', 'dots'].includes(qrStyleParam)) qrModuleStyle.value = qrStyleParam as QrModuleStyle;
            if (['square', 'rounded', 'circle'].includes(eyeStyleParam)) qrEyeStyle.value = eyeStyleParam as QrEyeStyle;
            if (['L', 'M', 'Q', 'H'].includes(eccParam)) qrErrorCorrection.value = eccParam as QrErrorCorrection;
            if (Number.isFinite(qrSizeParam) && qrSizeParam >= 256 && qrSizeParam <= 1024) qrSize.value = Math.round(qrSizeParam / 64) * 64;
            if (logoParam) qrCenterLogo.value = logoParam === '1';
          """
          if 'qrForeground.value = qrColorParam' not in text:
              if theme_restore not in text:
                  raise SystemExit('theme restore block not found')
              text = text.replace(theme_restore, theme_restore + design_restore, 1)

          old_keys = "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme']) {"
          new_keys = "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme', 'qrColor', 'qrBg', 'qrStyle', 'eyeStyle', 'ecc', 'qrSize', 'logo']) {"
          if old_keys not in text:
              raise SystemExit('query key cleanup anchor not found')
          text = text.replace(old_keys, new_keys, 1)

          theme_query = """  if (selectedTheme.value !== 'purple') {
            query.theme = selectedTheme.value;
          }
          """
          design_query = """  if (qrForeground.value !== DEFAULT_QR_FOREGROUND) query.qrColor = qrForeground.value;
            if (qrBackground.value !== DEFAULT_QR_BACKGROUND) query.qrBg = qrBackground.value;
            if (qrModuleStyle.value !== DEFAULT_QR_MODULE_STYLE) query.qrStyle = qrModuleStyle.value;
            if (qrEyeStyle.value !== DEFAULT_QR_EYE_STYLE) query.eyeStyle = qrEyeStyle.value;
            if (qrErrorCorrection.value !== DEFAULT_QR_ERROR_CORRECTION) query.ecc = qrErrorCorrection.value;
            if (qrSize.value !== DEFAULT_QR_SIZE) query.qrSize = String(qrSize.value);
            if (qrCenterLogo.value) query.logo = '1';
          """
          if 'query.qrColor' not in text:
              if theme_query not in text:
                  raise SystemExit('theme query anchor not found')
              text = text.replace(theme_query, theme_query + design_query, 1)

          old_qr = """watch(qrPayload, async (payload) => {
            if (!payload) {
              qrDataUrl.value = '';
              return;
            }

            try {
              const rendered = await QRCode.toDataURL(payload, {
                width: 720,
                margin: 4,
                errorCorrectionLevel: 'M',
                color: {
                  dark: '#111827',
                  light: '#ffffff',
                },
              });

              if (qrPayload.value === payload) {
                qrDataUrl.value = rendered;
              }
            }
            catch {
              if (qrPayload.value === payload) {
                qrDataUrl.value = '';
              }
            }
          }, { immediate: true });"""
          new_qr = """function isFinderModule(row: number, column: number, moduleCount: number) {
            return (row < 7 && column < 7)
              || (row < 7 && column >= moduleCount - 7)
              || (row >= moduleCount - 7 && column < 7);
          }

          function drawQrModule(context: CanvasRenderingContext2D, x: number, y: number, moduleSize: number, style: QrModuleStyle) {
            context.fillStyle = qrForeground.value;
            if (style === 'square') {
              context.fillRect(x, y, moduleSize + 0.05, moduleSize + 0.05);
              return;
            }
            const inset = style === 'dots' ? moduleSize * 0.12 : moduleSize * 0.06;
            const size = moduleSize - inset * 2;
            if (style === 'dots') {
              context.beginPath();
              context.arc(x + moduleSize / 2, y + moduleSize / 2, size / 2, 0, Math.PI * 2);
              context.fill();
              return;
            }
            fillRoundedRect(context, x + inset, y + inset, size, size, moduleSize * 0.28, qrForeground.value);
          }

          function drawQrEye(context: CanvasRenderingContext2D, startRow: number, startColumn: number, moduleSize: number, margin: number) {
            const x = (margin + startColumn) * moduleSize;
            const y = (margin + startRow) * moduleSize;
            const outer = moduleSize * 7;
            const middle = moduleSize * 5;
            const center = moduleSize * 3;
            const radius = qrEyeStyle.value === 'square' ? 0 : qrEyeStyle.value === 'circle' ? outer / 2 : moduleSize * 1.6;
            if (radius === 0) {
              context.fillStyle = qrForeground.value;
              context.fillRect(x, y, outer, outer);
              context.fillStyle = qrBackground.value;
              context.fillRect(x + moduleSize, y + moduleSize, middle, middle);
              context.fillStyle = qrForeground.value;
              context.fillRect(x + moduleSize * 2, y + moduleSize * 2, center, center);
              return;
            }
            fillRoundedRect(context, x, y, outer, outer, radius, qrForeground.value);
            fillRoundedRect(context, x + moduleSize, y + moduleSize, middle, middle, Math.max(moduleSize, radius - moduleSize), qrBackground.value);
            fillRoundedRect(context, x + moduleSize * 2, y + moduleSize * 2, center, center, qrEyeStyle.value === 'circle' ? center / 2 : moduleSize * 0.8, qrForeground.value);
          }

          async function renderStyledQr(payload: string) {
            const generated = QRCode.create(payload, { errorCorrectionLevel: qrErrorCorrection.value });
            const moduleCount = generated.modules.size;
            const margin = 4;
            const canvas = document.createElement('canvas');
            canvas.width = qrSize.value;
            canvas.height = qrSize.value;
            const context = canvas.getContext('2d');
            if (!context) return '';
            context.imageSmoothingEnabled = false;
            context.fillStyle = qrBackground.value;
            context.fillRect(0, 0, canvas.width, canvas.height);
            const moduleSize = canvas.width / (moduleCount + margin * 2);
            for (let row = 0; row < moduleCount; row += 1) {
              for (let column = 0; column < moduleCount; column += 1) {
                if (isFinderModule(row, column, moduleCount) || !generated.modules.data[row * moduleCount + column]) continue;
                drawQrModule(context, (margin + column) * moduleSize, (margin + row) * moduleSize, moduleSize, qrModuleStyle.value);
              }
            }
            drawQrEye(context, 0, 0, moduleSize, margin);
            drawQrEye(context, 0, moduleCount - 7, moduleSize, margin);
            drawQrEye(context, moduleCount - 7, 0, moduleSize, margin);
            if (qrCenterLogo.value && selectedBank.value?.logo) {
              const logo = await loadImage(selectedBank.value.logo).catch(() => null);
              if (logo) {
                const box = canvas.width * 0.18;
                const logoSize = box * 0.74;
                fillRoundedRect(context, (canvas.width - box) / 2, (canvas.height - box) / 2, box, box, box * 0.22, qrBackground.value);
                drawContainImage(context, logo, (canvas.width - logoSize) / 2, (canvas.height - logoSize) / 2, logoSize, logoSize);
              }
            }
            return canvas.toDataURL('image/png');
          }

          watch(
            [qrPayload, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],
            async ([payload]) => {
              const renderId = ++qrRenderId;
              if (!payload) {
                qrDataUrl.value = '';
                return;
              }
              try {
                const rendered = await renderStyledQr(payload);
                if (renderId === qrRenderId) qrDataUrl.value = rendered;
              }
              catch {
                if (renderId === qrRenderId) qrDataUrl.value = '';
              }
            },
            { immediate: true },
          );"""
          if old_qr not in text:
              raise SystemExit('old QR watcher not found')
          text = text.replace(old_qr, new_qr, 1)

          old_watch = """watch(
            [selectedBankBin, accountNo, amount, description, selectedTheme],
            scheduleUrlSync,
          );"""
          new_watch = """watch(
            [selectedBankBin, accountNo, amount, description, selectedTheme, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],
            scheduleUrlSync,
          );"""
          if old_watch not in text:
              raise SystemExit('URL watcher not found')
          text = text.replace(old_watch, new_watch, 1)

          reset_anchor = """function resetForm() {
            selectedBankBin.value = '';
            accountNo.value = '';
            amount.value = '';
            setDescriptionFromExternal('');

            window.localStorage.removeItem(`${STORAGE_PREFIX}:bank`);
            clearSensitiveStorage();
          }
          """
          if 'function resetDesign()' not in text:
              reset = """
          function resetDesign() {
            qrForeground.value = DEFAULT_QR_FOREGROUND;
            qrBackground.value = DEFAULT_QR_BACKGROUND;
            qrModuleStyle.value = DEFAULT_QR_MODULE_STYLE;
            qrEyeStyle.value = DEFAULT_QR_EYE_STYLE;
            qrErrorCorrection.value = DEFAULT_QR_ERROR_CORRECTION;
            qrSize.value = DEFAULT_QR_SIZE;
            qrCenterLogo.value = false;
          }
          """
              if reset_anchor not in text:
                  raise SystemExit('reset form anchor not found')
              text = text.replace(reset_anchor, reset_anchor + reset, 1)

          old_field = """              <c-input-text
                v-model:value=\"descriptionInput\"
                :label=\"t('contentLabel')\"
                :placeholder=\"t('contentPlaceholder')\"
                :validation-rules=\"descriptionValidationRules\"
                raw-text
              />"""
          new_field = """              <div class=\"content-field\">
                <c-input-text
                  v-model:value=\"descriptionInput\"
                  :label=\"t('contentLabel')\"
                  :placeholder=\"t('contentPlaceholder')\"
                  :validation-rules=\"descriptionValidationRules\"
                  raw-text
                />
                <div class=\"content-counter\">{{ descriptionCharacterCount }}/{{ VIETQR_MAX_DESCRIPTION_LENGTH }}</div>
              </div>"""
          if old_field not in text:
              raise SystemExit('content field anchor not found')
          text = text.replace(old_field, new_field, 1)

          technical_anchor = "        <c-card v-if=\"selectedBankInfo.length\" :title=\"t('technicalTitle')\">"
          if 'class="design-stack"' not in text:
              card = """        <c-card :title=\"t('designTitle')\">
            <div class=\"design-stack\">
              <div class=\"design-hint\">{{ t('designHint') }}</div>
              <div class=\"design-color-grid\">
                <label class=\"design-control\"><span>{{ t('qrColor') }}</span><div class=\"color-control\"><input v-model=\"qrForeground\" type=\"color\" aria-label=\"QR color\"><code>{{ qrForeground.toUpperCase() }}</code></div></label>
                <label class=\"design-control\"><span>{{ t('backgroundColor') }}</span><div class=\"color-control\"><input v-model=\"qrBackground\" type=\"color\" aria-label=\"QR background color\"><code>{{ qrBackground.toUpperCase() }}</code></div></label>
              </div>
              <div class=\"design-section\"><div class=\"design-label\">{{ t('moduleStyle') }}</div><div class=\"design-options\">
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'square' }\" @click=\"qrModuleStyle = 'square'\">{{ t('square') }}</button>
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'rounded' }\" @click=\"qrModuleStyle = 'rounded'\">{{ t('rounded') }}</button>
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrModuleStyle === 'dots' }\" @click=\"qrModuleStyle = 'dots'\">{{ t('dots') }}</button>
              </div></div>
              <div class=\"design-section\"><div class=\"design-label\">{{ t('eyeStyle') }}</div><div class=\"design-options\">
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'square' }\" @click=\"qrEyeStyle = 'square'\">{{ t('square') }}</button>
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'rounded' }\" @click=\"qrEyeStyle = 'rounded'\">{{ t('rounded') }}</button>
                <button type=\"button\" class=\"design-option\" :class=\"{ active: qrEyeStyle === 'circle' }\" @click=\"qrEyeStyle = 'circle'\">{{ t('circle') }}</button>
              </div></div>
              <div class=\"design-settings-grid\">
                <label class=\"design-control\"><span>{{ t('errorCorrection') }}</span><select v-model=\"qrErrorCorrection\" class=\"design-select\"><option value=\"L\">L (~7%)</option><option value=\"M\">M (~15%)</option><option value=\"Q\">Q (~25%)</option><option value=\"H\">H (~30%)</option></select><small>{{ t('errorCorrectionHint') }}</small></label>
                <label class=\"design-control\"><span>{{ t('qrSizeLabel') }}: {{ qrSize }}px</span><input v-model.number=\"qrSize\" class=\"design-range\" type=\"range\" min=\"256\" max=\"1024\" step=\"64\"></label>
              </div>
              <label class=\"logo-toggle\"><input v-model=\"qrCenterLogo\" type=\"checkbox\"><span><strong>{{ t('centerLogo') }}</strong><small>{{ t('centerLogoHint') }}</small></span></label>
              <div class=\"form-actions\"><c-button @click=\"resetDesign\">{{ t('resetDesign') }}</c-button></div>
            </div>
          </c-card>

          """
              if technical_anchor not in text:
                  raise SystemExit('technical card anchor not found')
              text = text.replace(technical_anchor, card + technical_anchor, 1)

          css_anchor = ".preview-column {\n  min-width: 0;\n}\n"
          if '.design-stack {' not in text:
              css = """.content-field { min-width: 0; }
          .content-counter { margin-top: 5px; opacity: 0.55; font-size: 11px; text-align: right; }
          .design-stack { display: flex; flex-direction: column; gap: 18px; }
          .design-hint { opacity: 0.65; font-size: 13px; }
          .design-color-grid, .design-settings-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
          .design-control { display: flex; min-width: 0; flex-direction: column; gap: 8px; font-size: 13px; font-weight: 600; }
          .design-control small, .logo-toggle small { opacity: 0.58; font-size: 11px; font-weight: 400; line-height: 1.4; }
          .color-control { display: flex; min-height: 42px; align-items: center; gap: 10px; box-sizing: border-box; padding: 6px 10px; border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 12px; }
          .color-control input[type='color'] { width: 32px; height: 32px; flex: none; padding: 0; border: 0; border-radius: 999px; background: transparent; cursor: pointer; }
          .color-control code { overflow: hidden; font-size: 12px; text-overflow: ellipsis; }
          .design-section { padding-top: 2px; }
          .design-label { margin-bottom: 9px; font-size: 13px; font-weight: 600; }
          .design-options { display: flex; flex-wrap: wrap; gap: 8px; }
          .design-option { min-height: 36px; padding: 7px 13px; border: 1px solid rgba(148, 163, 184, 0.32); border-radius: 999px; background: transparent; color: inherit; font: inherit; font-size: 12px; cursor: pointer; transition: border-color 140ms ease, background 140ms ease, transform 140ms ease; }
          .design-option:hover { transform: translateY(-1px); }
          .design-option.active { border-color: var(--primary-color, #6366f1); background: rgba(99, 102, 241, 0.1); font-weight: 700; }
          .design-select { width: 100%; min-height: 40px; box-sizing: border-box; padding: 0 10px; border: 1px solid rgba(148, 163, 184, 0.28); border-radius: 10px; background: transparent; color: inherit; }
          .design-range { width: 100%; accent-color: var(--primary-color, #6366f1); }
          .logo-toggle { display: flex; align-items: flex-start; gap: 10px; padding: 12px 14px; border: 1px solid rgba(148, 163, 184, 0.22); border-radius: 12px; cursor: pointer; }
          .logo-toggle input { margin-top: 3px; }
          .logo-toggle span { display: flex; flex-direction: column; gap: 3px; }

          """
              if css_anchor not in text:
                  raise SystemExit('CSS anchor not found')
              text = text.replace(css_anchor, css + css_anchor, 1)

          mobile_anchor = '@media (max-width: 480px) {\n'
          if '.design-color-grid,\n  .design-settings-grid' not in text:
