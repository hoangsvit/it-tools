name: Normalize VietQR preview indentation once

on:
  push:
    branches:
      - fix/vietqr-stale-live-preview
    paths:
      - .github/workflows/fix-vietqr-preview-indent-once.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          ref: fix/vietqr-stale-live-preview

      - name: Normalize indentation
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          source = path.read_text()
          old = (
              '                    <img\n'
              '        :src="qrDataUrl"\n'
              '        alt="VietQR bank transfer code"\n'
              '        class="qr-code-image"\n'
              '        :style="{ visibility: qrRendering ? \'hidden\' : \'visible\' }"\n'
              '      >'
          )
          new = (
              '                    <img\n'
              '                      :src="qrDataUrl"\n'
              '                      alt="VietQR bank transfer code"\n'
              '                      class="qr-code-image"\n'
              '                      :style="{ visibility: qrRendering ? \'hidden\' : \'visible\' }"\n'
              '                    >'
          )

          count = source.count(old)
          if count != 1:
              raise SystemExit(f'expected one QR image block, found {count}')

          path.write_text(source.replace(old, new))
          PY

          rm .github/workflows/fix-vietqr-preview-indent-once.yml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "style: normalize VietQR preview markup"
          git push
