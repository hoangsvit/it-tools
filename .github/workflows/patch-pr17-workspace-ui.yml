name: Patch PR17 workspace handoff UI

on:
  push:
    branches:
      - agent/developer-workspace
    paths:
      - .github/workflows/patch-pr17-workspace-ui.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3df4ab11eba7bda6032a0b82a6bb43b11571feac
        with:
          ref: agent/developer-workspace
          fetch-depth: 0
      - name: Apply whitespace-aware handoff state
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('src/pages/DeveloperWorkspace.page.vue')
          source = path.read_text()
          replacements = {
            ':disabled="!workspace.steps[index - 1]?.output"': ':disabled="!workspace.steps[index - 1]?.output.trim()"',
            ':disabled="!step.output"\n                        @click="workspaceStore.sendOutputToNext': ':disabled="!step.output.trim()"\n                        @click="workspaceStore.sendOutputToNext',
          }

          for old, new in replacements.items():
            if old not in source:
              raise SystemExit(f'missing expected expression: {old}')
            source = source.replace(old, new, 1)

          path.write_text(source)
          PY
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/DeveloperWorkspace.page.vue
          git commit -m "fix: disable blank workspace handoffs"
          git push origin HEAD:agent/developer-workspace
