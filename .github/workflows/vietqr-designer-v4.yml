name: Apply VietQR designer feature

on:
  push:
    branches:
      - fix/vietqr-desktop-layout
    paths:
      - .github/workflows/vietqr-designer-v4.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-desktop-layout
          fetch-depth: 0

      - name: Apply VietQR designer changes
        shell: bash
        run: |
          cat > /tmp/patch_vietqr.py <<'PY'
          from pathlib import Path
          import re

          def b(*lines):
              return '\n'.join(lines)

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'{label}: anchor not found')
              return text.replace(old, new, 1)

          def sub_once(text, pattern, replacement, label, flags=0):
              updated, count = re.subn(pattern, replacement, text, count=1, flags=flags)
              if count != 1:
                  raise SystemExit(f'{label}: expected 1 match, got {count}')
              return updated

          # -----------------------------------------------------------------
          # Service: transfer content limit = 50 characters.
          # -----------------------------------------------------------------
          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.ts')
          text = path.read_text(encoding='utf-8')
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = replace_once(
                  text,
                  "export const VIETQR_MAX_AMOUNT = '9999999999999';",
                  "export const VIETQR_MAX_AMOUNT = '9999999999999';\nexport const VIETQR_MAX_DESCRIPTION_LENGTH = 50;",
                  'service constant',
              )
          text = text.replace('normalized.length > 25', 'normalized.length > VIETQR_MAX_DESCRIPTION_LENGTH')
          path.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Unit tests.
          # -----------------------------------------------------------------
          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.service.test.ts')
          text = path.read_text(encoding='utf-8')
          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = replace_once(
                  text,
                  '  VIETQR_MAX_AMOUNT,',
                  '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,',
                  'test import',
              )
          text = replace_once(
              text,
              "    expect(getVietQrDescriptionValidationError('12345678901234567890123456')).toBe('contentLength');",
              b(
                  '    expect(VIETQR_MAX_DESCRIPTION_LENGTH).toBe(50);',
                  "    expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH))).toBeNull();",
                  "    expect(getVietQrDescriptionValidationError('a'.repeat(VIETQR_MAX_DESCRIPTION_LENGTH + 1))).toBe('contentLength');",
              ),
              'description length test',
          )
          path.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # i18n: update existing transfer-content limit texts; add EN/VI
          # designer labels. Other locales fall back to English designer labels.
          # -----------------------------------------------------------------
          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.i18n.ts')
          lines = path.read_text(encoding='utf-8').splitlines()
          lines = [line.replace('25', '50') if ('contentPlaceholder:' in line or 'contentLength:' in line) else line for line in lines]
          text = '\n'.join(lines) + '\n'

          en_keys = b(
              "    designTitle: 'QR design',",
              "    designHint: 'Customize QR colors, module shape, finder style, error correction, bank logo and output size.',",
              "    qrColor: 'QR color',",
              "    backgroundColor: 'Background color',",
              "    moduleStyle: 'QR module shape',",
              "    eyeStyle: 'Finder style',",
              "    square: 'Square',",
              "    rounded: 'Rounded',",
              "    dots: 'Dots',",
              "    circle: 'Circle',",
              "    errorCorrection: 'Error correction',",
              "    errorCorrectionHint: 'Use H when placing a logo in the center.',",
              "    qrSizeLabel: 'QR resolution',",
              "    centerLogo: 'Bank logo in QR center',",
              "    centerLogoHint: 'Places the selected bank logo on a protected background area.',",
              "    resetDesign: 'Reset design',",
          )
          vi_keys = b(
              "    designTitle: 'Thiết kế QR',",
              "    designHint: 'Tùy chỉnh màu sắc, hình dạng điểm QR, mắt QR, mức sửa lỗi, logo ngân hàng và kích thước ảnh.',",
              "    qrColor: 'Màu QR',",
              "    backgroundColor: 'Màu nền',",
              "    moduleStyle: 'Kiểu hình dạng QR',",
              "    eyeStyle: 'Kiểu viền 3 góc',",
              "    square: 'Vuông',",
              "    rounded: 'Bo tròn',",
              "    dots: 'Tròn',",
              "    circle: 'Tròn',",
              "    errorCorrection: 'Mức độ sửa lỗi',",
              "    errorCorrectionHint: 'Nên dùng mức H khi đặt logo ở giữa QR.',",
              "    qrSizeLabel: 'Kích thước QR',",
              "    centerLogo: 'Logo ngân hàng giữa QR',",
              "    centerLogoHint: 'Chèn logo ngân hàng đã chọn vào giữa QR với vùng nền bảo vệ.',",
              "    resetDesign: 'Đặt lại thiết kế',",
          )

          if 'designTitle:' not in text:
              text = sub_once(
                  text,
                  r"(  en: \{.*?^    contentPlaceholder: .*?$)",
                  lambda m: m.group(1) + '\n' + en_keys,
                  'English designer translations',
                  re.MULTILINE | re.DOTALL,
              )
              text = sub_once(
                  text,
                  r"(  vi: \{.*?^    contentPlaceholder: .*?$)",
                  lambda m: m.group(1) + '\n' + vi_keys,
                  'Vietnamese designer translations',
                  re.MULTILINE | re.DOTALL,
              )
          path.write_text(text, encoding='utf-8')

          # -----------------------------------------------------------------
          # Vue component.
          # -----------------------------------------------------------------
          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = path.read_text(encoding='utf-8')

          if 'VIETQR_MAX_DESCRIPTION_LENGTH' not in text:
              text = replace_once(
                  text,
                  '  VIETQR_MAX_AMOUNT,',
                  '  VIETQR_MAX_AMOUNT,\n  VIETQR_MAX_DESCRIPTION_LENGTH,',
                  'Vue description import',
              )

          if 'type QrModuleStyle' not in text:
              text = replace_once(
                  text,
                  "type CopyState = 'idle' | 'copied' | 'unsupported' | 'failed';",
                  b(
                      "type CopyState = 'idle' | 'copied' | 'unsupported' | 'failed';",
                      "type QrModuleStyle = 'square' | 'rounded' | 'dots';",
                      "type QrEyeStyle = 'square' | 'rounded' | 'circle';",
                      "type QrErrorCorrection = 'L' | 'M' | 'Q' | 'H';",
                  ),
                  'Vue designer types',
              )

          if 'DEFAULT_QR_FOREGROUND' not in text:
              text = replace_once(
                  text,
                  "const CANVAS_MONO_FONT_FAMILY = 'ui-monospace, \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace';",
                  b(
                      "const CANVAS_MONO_FONT_FAMILY = 'ui-monospace, \"SFMono-Regular\", Consolas, \"Liberation Mono\", monospace';",
                      "const DEFAULT_QR_FOREGROUND = '#111827';",
                      "const DEFAULT_QR_BACKGROUND = '#ffffff';",
                      "const DEFAULT_QR_MODULE_STYLE: QrModuleStyle = 'square';",
                      "const DEFAULT_QR_EYE_STYLE: QrEyeStyle = 'square';",
                      "const DEFAULT_QR_ERROR_CORRECTION: QrErrorCorrection = 'M';",
                      'const DEFAULT_QR_SIZE = 512;',
                  ),
                  'Vue designer constants',
              )

          text = replace_once(
              text,
              '    descriptionValue.value = value;\n    scheduleDescriptionNormalization();',
              '    descriptionValue.value = value.slice(0, VIETQR_MAX_DESCRIPTION_LENGTH);\n    scheduleDescriptionNormalization();',
              'content input max length',
          )

          if 'const qrForeground = ref(' not in text:
              text = replace_once(
                  text,
                  "const selectedTheme = ref<ThemeName>('purple');",
                  b(
                      "const selectedTheme = ref<ThemeName>('purple');",
                      'const qrForeground = ref(DEFAULT_QR_FOREGROUND);',
                      'const qrBackground = ref(DEFAULT_QR_BACKGROUND);',
                      'const qrModuleStyle = ref<QrModuleStyle>(DEFAULT_QR_MODULE_STYLE);',
                      'const qrEyeStyle = ref<QrEyeStyle>(DEFAULT_QR_EYE_STYLE);',
                      'const qrErrorCorrection = ref<QrErrorCorrection>(DEFAULT_QR_ERROR_CORRECTION);',
                      'const qrSize = ref(DEFAULT_QR_SIZE);',
                      'const qrCenterLogo = ref(false);',
                  ),
                  'designer state',
              )
          if 'let qrRenderId = 0;' not in text:
              text = replace_once(text, 'let shareImageRenderId = 0;', 'let shareImageRenderId = 0;\nlet qrRenderId = 0;', 'QR render id')

          if 'descriptionCharacterCount' not in text:
              marker = "  : t('validation.amount'));"
              text = replace_once(
                  text,
                  marker,
                  marker + '\nconst descriptionCharacterCount = computed(() => descriptionValue.value.length);',
                  'content character counter',
              )

          # URL restore declarations.
          text = replace_once(
              text,
              "  const themeParam = queryValue('theme').toLowerCase();",
              b(
                  "  const themeParam = queryValue('theme').toLowerCase();",
                  "  const qrColorParam = queryValue('qrColor');",
                  "  const qrBgParam = queryValue('qrBg');",
                  "  const qrStyleParam = queryValue('qrStyle');",
                  "  const eyeStyleParam = queryValue('eyeStyle');",
                  "  const eccParam = queryValue('ecc').toUpperCase();",
                  "  const qrSizeParam = Number(queryValue('qrSize'));",
                  "  const logoParam = queryValue('logo');",
              ),
              'designer URL declarations',
          )

          design_restore = b(
              '',
              "  if (/^#[0-9a-f]{6}$/i.test(qrColorParam)) {",
              '    qrForeground.value = qrColorParam.toLowerCase();',
              '  }',
              "  if (/^#[0-9a-f]{6}$/i.test(qrBgParam)) {",
              '    qrBackground.value = qrBgParam.toLowerCase();',
              '  }',
              "  if (['square', 'rounded', 'dots'].includes(qrStyleParam)) {",
              '    qrModuleStyle.value = qrStyleParam as QrModuleStyle;',
              '  }',
              "  if (['square', 'rounded', 'circle'].includes(eyeStyleParam)) {",
              '    qrEyeStyle.value = eyeStyleParam as QrEyeStyle;',
              '  }',
              "  if (['L', 'M', 'Q', 'H'].includes(eccParam)) {",
              '    qrErrorCorrection.value = eccParam as QrErrorCorrection;',
              '  }',
              '  if (Number.isFinite(qrSizeParam) && qrSizeParam >= 256 && qrSizeParam <= 1024) {',
              '    qrSize.value = Math.round(qrSizeParam / 64) * 64;',
              '  }',
              '  if (logoParam) {',
              "    qrCenterLogo.value = logoParam === '1';",
              '  }',
          )
          theme_restore_pattern = r"(  if \(themeParam\) \{\n    selectedTheme\.value = themeParam in THEME_PRESETS\n      \? themeParam as ThemeName\n      : 'purple';\n  \})"
          text = sub_once(
              text,
              theme_restore_pattern,
              lambda m: m.group(1) + design_restore,
              'designer URL restore',
          )

          text = replace_once(
              text,
              "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme']) {",
              "for (const key of ['bank', 'bin', 'bankId', 'account', 'accountNo', 'amount', 'content', 'description', 'theme', 'qrColor', 'qrBg', 'qrStyle', 'eyeStyle', 'ecc', 'qrSize', 'logo']) {",
              'designer URL cleanup',
          )

          design_query = b(
              '',
              '  if (qrForeground.value !== DEFAULT_QR_FOREGROUND) {',
              '    query.qrColor = qrForeground.value;',
              '  }',
              '  if (qrBackground.value !== DEFAULT_QR_BACKGROUND) {',
              '    query.qrBg = qrBackground.value;',
              '  }',
              '  if (qrModuleStyle.value !== DEFAULT_QR_MODULE_STYLE) {',
              '    query.qrStyle = qrModuleStyle.value;',
              '  }',
              '  if (qrEyeStyle.value !== DEFAULT_QR_EYE_STYLE) {',
              '    query.eyeStyle = qrEyeStyle.value;',
              '  }',
              '  if (qrErrorCorrection.value !== DEFAULT_QR_ERROR_CORRECTION) {',
              '    query.ecc = qrErrorCorrection.value;',
              '  }',
              '  if (qrSize.value !== DEFAULT_QR_SIZE) {',
              '    query.qrSize = String(qrSize.value);',
              '  }',
              '  if (qrCenterLogo.value) {',
              "    query.logo = '1';",
              '  }',
          )
          theme_query_pattern = r"(  if \(selectedTheme\.value !== 'purple'\) \{\n    query\.theme = selectedTheme\.value;\n  \})"
          text = sub_once(
              text,
              theme_query_pattern,
              lambda m: m.group(1) + design_query,
              'designer URL query',
          )

          # Custom QR renderer. Finder patterns remain structurally correct,
          # while non-finder modules can be square/rounded/dots.
          renderer = b(
              'function isFinderModule(row: number, column: number, moduleCount: number) {',
              '  return (row < 7 && column < 7)',
              '    || (row < 7 && column >= moduleCount - 7)',
              '    || (row >= moduleCount - 7 && column < 7);',
              '}',
              '',
              'function drawQrModule(',
              '  context: CanvasRenderingContext2D,',
              '  x: number,',
              '  y: number,',
              '  moduleSize: number,',
              '  style: QrModuleStyle,',
              ') {',
              '  context.fillStyle = qrForeground.value;',
              "  if (style === 'square') {",
              '    context.fillRect(x, y, moduleSize + 0.05, moduleSize + 0.05);',
              '    return;',
              '  }',
              '',
              "  const inset = style === 'dots' ? moduleSize * 0.12 : moduleSize * 0.06;",
              '  const size = moduleSize - inset * 2;',
              "  if (style === 'dots') {",
              '    context.beginPath();',
              '    context.arc(x + moduleSize / 2, y + moduleSize / 2, size / 2, 0, Math.PI * 2);',
              '    context.fill();',
              '    return;',
              '  }',
              '',
              '  fillRoundedRect(context, x + inset, y + inset, size, size, moduleSize * 0.28, qrForeground.value);',
              '}',
              '',
              'function drawQrEye(',
              '  context: CanvasRenderingContext2D,',
              '  startRow: number,',
              '  startColumn: number,',
              '  moduleSize: number,',
              '  margin: number,',
              ') {',
              '  const x = (margin + startColumn) * moduleSize;',
              '  const y = (margin + startRow) * moduleSize;',
              '  const outer = moduleSize * 7;',
              '  const middle = moduleSize * 5;',
              '  const center = moduleSize * 3;',
              '  let outerRadius = 0;',
              "  if (qrEyeStyle.value === 'rounded') {",
              '    outerRadius = moduleSize * 1.6;',
              '  }',
              "  else if (qrEyeStyle.value === 'circle') {",
              '    outerRadius = outer / 2;',
              '  }',
              '',
              '  if (outerRadius === 0) {',
              '    context.fillStyle = qrForeground.value;',
              '    context.fillRect(x, y, outer, outer);',
              '    context.fillStyle = qrBackground.value;',
              '    context.fillRect(x + moduleSize, y + moduleSize, middle, middle);',
              '    context.fillStyle = qrForeground.value;',
              '    context.fillRect(x + moduleSize * 2, y + moduleSize * 2, center, center);',
              '    return;',
              '  }',
              '',
              '  fillRoundedRect(context, x, y, outer, outer, outerRadius, qrForeground.value);',
              '  fillRoundedRect(context, x + moduleSize, y + moduleSize, middle, middle, Math.max(moduleSize, outerRadius - moduleSize), qrBackground.value);',
              "  const centerRadius = qrEyeStyle.value === 'circle' ? center / 2 : moduleSize * 0.8;",
              '  fillRoundedRect(context, x + moduleSize * 2, y + moduleSize * 2, center, center, centerRadius, qrForeground.value);',
              '}',
              '',
              'async function renderStyledQr(payload: string) {',
              '  const generated = QRCode.create(payload, { errorCorrectionLevel: qrErrorCorrection.value });',
              '  const moduleCount = generated.modules.size;',
              '  const margin = 4;',
              "  const canvas = document.createElement('canvas');",
              '  canvas.width = qrSize.value;',
              '  canvas.height = qrSize.value;',
              "  const context = canvas.getContext('2d');",
              '  if (!context) {',
              "    return '';",
              '  }',
              '',
              '  context.imageSmoothingEnabled = false;',
              '  context.fillStyle = qrBackground.value;',
              '  context.fillRect(0, 0, canvas.width, canvas.height);',
              '  const moduleSize = canvas.width / (moduleCount + margin * 2);',
              '',
              '  for (let row = 0; row < moduleCount; row += 1) {',
              '    for (let column = 0; column < moduleCount; column += 1) {',
              '      if (isFinderModule(row, column, moduleCount)) {',
              '        continue;',
              '      }',
              '      if (!generated.modules.data[row * moduleCount + column]) {',
              '        continue;',
              '      }',
              '      drawQrModule(',
              '        context,',
              '        (margin + column) * moduleSize,',
              '        (margin + row) * moduleSize,',
              '        moduleSize,',
              '        qrModuleStyle.value,',
              '      );',
              '    }',
              '  }',
              '',
              '  drawQrEye(context, 0, 0, moduleSize, margin);',
              '  drawQrEye(context, 0, moduleCount - 7, moduleSize, margin);',
              '  drawQrEye(context, moduleCount - 7, 0, moduleSize, margin);',
              '',
              '  if (qrCenterLogo.value && selectedBank.value?.logo) {',
              '    const logo = await loadImage(selectedBank.value.logo).catch(() => null);',
              '    if (logo) {',
              '      const logoBoxSize = canvas.width * 0.18;',
              '      const logoSize = logoBoxSize * 0.74;',
              '      fillRoundedRect(',
              '        context,',
              '        (canvas.width - logoBoxSize) / 2,',
              '        (canvas.height - logoBoxSize) / 2,',
              '        logoBoxSize,',
              '        logoBoxSize,',
              '        logoBoxSize * 0.22,',
              '        qrBackground.value,',
              '      );',
              '      drawContainImage(',
              '        context,',
              '        logo,',
              '        (canvas.width - logoSize) / 2,',
              '        (canvas.height - logoSize) / 2,',
              '        logoSize,',
              '        logoSize,',
              '      );',
              '    }',
              '  }',
              '',
              "  return canvas.toDataURL('image/png');",
              '}',
              '',
              'watch(',
              '  [qrPayload, qrForeground, qrBackground, qrModuleStyle, qrEyeStyle, qrErrorCorrection, qrSize, qrCenterLogo],',
              '  async ([payload]) => {',
              '    const renderId = ++qrRenderId;',
              '    if (!payload) {',
              "      qrDataUrl.value = '';",
              '      return;',
              '    }',
              '',
              '    try {',
              '      const rendered = await renderStyledQr(payload);',
              '      if (renderId === qrRenderId) {',
              '        qrDataUrl.value = rendered;',
              '      }',
              '    }',
              '    catch {',
              '      if (renderId === qrRenderId) {',
              "        qrDataUrl.value = '';",
              '      }',
              '    }',
              '  },',
              '  { immediate: true },',
              ');',
          )
          watcher_pattern = r"watch\(qrPayload, async \(payload\) => \{.*?\}, \{ immediate: true \}\);"
          text = sub_once(text, watcher_pattern, renderer, 'QR renderer', re.DOTALL)

          url_watch_pattern = r"watch\(\n  \[selectedBankBin, accountNo, amount, description, selectedTheme\],\n  scheduleUrlSync,\n\);"
          url_watch = b(
              'watch(',
              '  [',
              '    selectedBankBin,',
              '    accountNo,',
              '    amount,',
              '    description,',
              '    selectedTheme,',
              '    qrForeground,',
              '    qrBackground,',
              '    qrModuleStyle,',
              '    qrEyeStyle,',
              '    qrErrorCorrection,',
              '    qrSize,',
              '    qrCenterLogo,',
              '  ],',
              '  scheduleUrlSync,',
              ');',
          )
          text = sub_once(text, url_watch_pattern, url_watch, 'designer URL watcher')

          if 'function resetDesign()' not in text:
              reset_design = b(
                  '',
                  'function resetDesign() {',
                  '  qrForeground.value = DEFAULT_QR_FOREGROUND;',
                  '  qrBackground.value = DEFAULT_QR_BACKGROUND;',
                  '  qrModuleStyle.value = DEFAULT_QR_MODULE_STYLE;',
                  '  qrEyeStyle.value = DEFAULT_QR_EYE_STYLE;',
                  '  qrErrorCorrection.value = DEFAULT_QR_ERROR_CORRECTION;',
                  '  qrSize.value = DEFAULT_QR_SIZE;',
                  '  qrCenterLogo.value = false;',
                  '}',
              )
              reset_pattern = r"(function resetForm\(\) \{.*?\n\})\n\nfunction loadImage"
              text = sub_once(
                  text,
                  reset_pattern,
                  lambda m: m.group(1) + reset_design + '\n\nfunction loadImage',
                  'reset designer',
                  re.DOTALL,
              )

          # Transfer content field + counter.
          content_pattern = r"              <c-input-text\n                v-model:value=\"descriptionInput\"\n                :label=\"t\('contentLabel'\)\"\n                :placeholder=\"t\('contentPlaceholder'\)\"\n                :validation-rules=\"descriptionValidationRules\"\n                raw-text\n              />"
          content_field = b(
              '              <div class="content-field">',
              '                <c-input-text',
              '                  v-model:value="descriptionInput"',
              "                  :label=\"t('contentLabel')\"",
              "                  :placeholder=\"t('contentPlaceholder')\"",
              '                  :validation-rules="descriptionValidationRules"',
              '                  raw-text',
              '                />',
              '                <div class="content-counter">',
              '                  {{ descriptionCharacterCount }}/{{ VIETQR_MAX_DESCRIPTION_LENGTH }}',
              '                </div>',
              '              </div>',
          )
          text = sub_once(text, content_pattern, content_field, 'content field counter')

          # Design card before technical details.
          if 'class="design-stack"' not in text:
              design_card = b(
                  '        <c-card :title="t(\'designTitle\')">',
                  '          <div class="design-stack">',
                  '            <div class="design-hint">{{ t(\'designHint\') }}</div>',
                  '',
                  '            <div class="design-color-grid">',
                  '              <label class="design-control">',
                  '                <span>{{ t(\'qrColor\') }}</span>',
                  '                <div class="color-control">',
                  '                  <input v-model="qrForeground" type="color" aria-label="QR color">',
                  '                  <code>{{ qrForeground.toUpperCase() }}</code>',
                  '                </div>',
                  '              </label>',
                  '              <label class="design-control">',
                  '                <span>{{ t(\'backgroundColor\') }}</span>',
                  '                <div class="color-control">',
                  '                  <input v-model="qrBackground" type="color" aria-label="QR background color">',
                  '                  <code>{{ qrBackground.toUpperCase() }}</code>',
                  '                </div>',
                  '              </label>',
                  '            </div>',
                  '',
                  '            <div class="design-section">',
                  '              <div class="design-label">{{ t(\'moduleStyle\') }}</div>',
                  '              <div class="design-options">',
                  '                <button type="button" class="design-option" :class="{ active: qrModuleStyle === \'square\' }" @click="qrModuleStyle = \'square\'">{{ t(\'square\') }}</button>',
                  '                <button type="button" class="design-option" :class="{ active: qrModuleStyle === \'rounded\' }" @click="qrModuleStyle = \'rounded\'">{{ t(\'rounded\') }}</button>',
                  '                <button type="button" class="design-option" :class="{ active: qrModuleStyle === \'dots\' }" @click="qrModuleStyle = \'dots\'">{{ t(\'dots\') }}</button>',
                  '              </div>',
                  '            </div>',
                  '',
                  '            <div class="design-section">',
                  '              <div class="design-label">{{ t(\'eyeStyle\') }}</div>',
                  '              <div class="design-options">',
                  '                <button type="button" class="design-option" :class="{ active: qrEyeStyle === \'square\' }" @click="qrEyeStyle = \'square\'">{{ t(\'square\') }}</button>',
                  '                <button type="button" class="design-option" :class="{ active: qrEyeStyle === \'rounded\' }" @click="qrEyeStyle = \'rounded\'">{{ t(\'rounded\') }}</button>',
