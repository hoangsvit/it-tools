name: Apply VietQR mobile layout improvements

on:
  push:
    branches:
      - fix/vietqr-mobile-layout

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/vietqr-mobile-layout
          fetch-depth: 0

      - name: Patch VietQR mobile layout
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('src/tools/vietqr-bank-generator/vietqr-bank-generator.vue')
          text = path.read_text(encoding='utf-8')

          def replace_once(old: str, new: str, label: str):
              global text
              if old not in text:
                  raise SystemExit(f'{label} anchor not found')
              text = text.replace(old, new, 1)

          # Wrap the main form so mobile can place the preview immediately after it.
          replace_once(
              '      <div class="form-column">\n        <c-card :title="t(\'createTitle\')">',
              '      <div class="form-column">\n        <div class="create-card-slot">\n          <c-card :title="t(\'createTitle\')">',
              'create card start',
          )

          replace_once(
              '        </c-card>\n\n        <c-card :title="t(\'designTitle\')">',
              '          </c-card>\n        </div>\n\n        <div class="design-card-slot">\n          <c-card :title="t(\'designTitle\')">',
              'create/design boundary',
          )

          replace_once(
              '        </c-card>\n        <c-card v-if="selectedBankInfo.length" :title="t(\'technicalTitle\')">',
              '          </c-card>\n        </div>\n\n        <div v-if="selectedBankInfo.length" class="secondary-card-slot">\n          <c-card :title="t(\'technicalTitle\')">',
              'design/technical boundary',
          )

          replace_once(
              '          <c-key-value-list :items="selectedBankInfo" />\n        </c-card>\n\n        <c-card v-if="qrPayload" :title="t(\'payloadTitle\')">',
              '          <c-key-value-list :items="selectedBankInfo" />\n          </c-card>\n        </div>\n\n        <div v-if="qrPayload" class="secondary-card-slot">\n          <c-card :title="t(\'payloadTitle\')">',
              'technical/payload boundary',
          )

          replace_once(
              '          <div class="payload-meta">\n            {{ t(\'payloadMeta\') }}\n          </div>\n        </c-card>\n      </div>',
              '          <div class="payload-meta">\n            {{ t(\'payloadMeta\') }}\n          </div>\n          </c-card>\n        </div>\n      </div>',
              'payload wrapper end',
          )

          # Replace mobile breakpoint with a phone-first layout closer to the target UI.
          start = text.index('@media (max-width: 480px) {')
          end = text.index('\n</style>', start)
          mobile_css = '''@media (max-width: 767px) {
  .vietqr-tool,
  .vietqr-layout {
    gap: 14px;
  }

  /* On phones: form -> live preview -> design -> technical details. */
  .form-column {
    display: contents;
  }

  .create-card-slot {
    order: 1;
  }

  .preview-column {
    order: 2;
  }

  .design-card-slot {
    order: 3;
  }

  .secondary-card-slot {
    order: 4;
  }

  .create-card-slot,
  .design-card-slot,
  .secondary-card-slot,
  .preview-column {
    min-width: 0;
  }

  .form-stack {
    gap: 14px;
  }

  .design-stack {
    gap: 15px;
  }

  .design-color-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 10px;
  }

  .design-settings-grid {
    grid-template-columns: minmax(0, 1fr);
    gap: 14px;
  }

  .design-options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 8px;
  }

  .design-option {
    width: 100%;
    min-height: 42px;
    padding: 8px 6px;
    text-align: center;
    touch-action: manipulation;
  }

  .color-control {
    min-height: 46px;
    padding: 6px 8px;
  }

  .color-control input[type='color'] {
    width: 34px;
    height: 34px;
  }

  .color-control code {
    min-width: 0;
    font-size: 11px;
  }

  .logo-toggle {
    min-height: 48px;
    box-sizing: border-box;
    padding: 12px;
  }

  .form-actions > * {
    min-height: 42px;
  }

  .bank-summary {
    align-items: flex-start;
    gap: 10px;
    padding: 10px 12px;
  }

  .bank-logo-box {
    width: 64px;
    height: 42px;
  }

  .bank-logo {
    max-width: 54px;
    max-height: 30px;
  }

  .bank-bin {
    display: none;
  }

  .theme-picker {
    justify-content: center;
    overflow-x: auto;
    margin: -2px 0 10px;
    padding: 2px 2px 4px;
    scrollbar-width: none;
  }

  .theme-picker::-webkit-scrollbar {
    display: none;
  }

  .theme-swatch {
    width: 34px;
    height: 34px;
    flex: none;
  }

  .preview-stage {
    min-height: 0;
    padding: 10px;
    border-radius: 22px;
  }

  .preview-stage-exported {
    padding: 0;
    border-radius: 0;
  }

  .share-preview-image {
    width: 100%;
    max-width: none;
    border-radius: 22px;
  }

  .payment-sheet {
    width: 100%;
    max-width: none;
    padding: 17px 12px 12px;
    border-radius: 23px;
  }

  .payment-sheet-empty {
    min-height: 470px;
  }

  .preview-bank-logo {
    max-width: 126px;
    max-height: 40px;
  }

  .scan-title {
    margin-top: 10px;
    font-size: 19px;
  }

  .qr-frame {
    width: min(100%, 278px);
    margin-top: 16px;
  }

  .qr-surface {
    padding: 8px;
    border-radius: 20px;
  }

  .account-card {
    margin-top: 18px;
    padding: 11px 12px 12px;
  }

  .account-card strong {
    font-size: clamp(17px, 5.5vw, 22px);
  }

  .payment-details {
    padding-inline: 11px;
  }

  .detail-row {
    gap: 10px;
  }

  .detail-row strong {
    overflow: visible;
    overflow-wrap: anywhere;
    white-space: normal;
  }

  .qr-actions {
    grid-template-columns: repeat(2, minmax(0, 1fr));
    gap: 8px;
    max-width: none;
    margin: 12px auto 10px;
  }

  .qr-actions > * {
    min-width: 0;
    min-height: 44px;
  }

  .decor-dots {
    display: none;
  }
}

@media (max-width: 359px) {
  .design-color-grid,
  .design-options,
  .qr-actions {
    grid-template-columns: minmax(0, 1fr);
  }

  .payment-sheet {
    padding-inline: 9px;
  }

  .qr-frame {
    width: min(100%, 250px);
  }
}'''
          text = text[:start] + mobile_css + text[end:]

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/vietqr-mobile-layout-patch.yml

      - name: Commit mobile layout
        shell: bash
        run: |
          git config user.name "David Nguyen"
          git config user.email "h250694@gmail.com"
          git add src/tools/vietqr-bank-generator/vietqr-bank-generator.vue .github/workflows/vietqr-mobile-layout-patch.yml
          git commit -m "fix: optimize VietQR layout for mobile"
          git push origin HEAD:fix/vietqr-mobile-layout
